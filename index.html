<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phoenix - Histo Page</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#b99272;
    font-family:Georgia, serif;
    text-align:center;
    overflow-x:hidden;
}


/* Top Paper */

.paper{
    width:80%;
    max-width:900px;
    margin:40px auto;
    box-sizing:border-box;
    background:#f8f1df;
    border:8px solid #d8c3a3;
    padding:50px;
    position:relative;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}


.paper h3{
    color:#5b3a1e;
    margin:0;
    font-size:32px;
}


.paper h4{
    color:#5b3a1e;
    margin:10px 0;
    font-size:24px;
}


.paper h1{
    color:#5b3a1e;
    font-size:90px;
    font-family:cursive;
    margin-top:70px;
}


/* Decorations */

.clock{
    position:absolute;
    top:-20px;
    right:-20px;
    width:80px;
}


.feather{
    position:absolute;
    left:-20px;
    bottom:10px;
    width:130px;
}


.phoenix-logo{
    width:120px;
    margin-bottom:20px;
}


/* Buttons */

.buttons{
    width:100%;
    margin:60px auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}


.info-button{
    width:60%;
    background:#8b5a2b;
    color:#f8f1df;
    border:none;
    padding:20px 40px;
    margin:25px auto;
    font-size:25px;
    font-family:Georgia, serif;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 5px 10px rgba(0,0,0,.3);
    transition:0.3s;
}


.info-button:hover{
    background:#a66b35;
    transform:translateY(-5px);
    box-shadow:0 10px 15px rgba(0,0,0,.4);
}


.info-button:active{
    transform:translateY(2px);
}


/* Bottom Images */

.bottom-images{
    width:100%;
    height:220px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:100px;
}


.church{
    width:400px;
    opacity:0.80;
}


.tower{
    width:280px;
  opacity:0.80;
}


/* Mobile */

@media screen and (max-width:600px){

.paper{
    width:90%;
    padding:30px;
}


.paper h1{
    font-size:55px;
}


.paper h3{
    font-size:24px;
}


.paper h4{
    font-size:18px;
}


.phoenix-logo{
    width:90px;
}


.info-button{
    width:85%;
    font-size:18px;
    padding:15px 20px;
}


.clock{
    width:60px;
}


.feather{
    width:90px;
}


.church{
    width:230px;
    opacity:0.80;
}


.tower{
    width:170px;
    opacity:0.80;
}

}

</style>

</head>


<body>


<div class="paper">

    <img class="clock" src="Clock.png">

    <img class="phoenix-logo" src="Phoenix.png">

    <h3>HISTO PAGE</h3>
    <h4>TECH-PRO 1103</h4>

    <h1>"Phoenix"</h1>

    <img class="feather" src="Feather.png">

</div>



<div class="buttons">


<button class="info-button" onclick="location.href='members.html'">
Members
</button>


<button class="info-button" onclick="location.href='history.html'">
Kahulugan ng Kasaysayan
</button>


<button class="info-button" onclick="location.href='heograpiya.html'">
Pag-aaral ng Heograpiya ng Mundo
</button>


<button class="info-button" onclick="location.href='muntinlupa.html'">
Kamalayang Pangkasaysayan at Lokal na Konteksto ng Muntinlupa
</button>


<button class="info-button" onclick="location.href='groups.html'">
Iba't-ibang Pangkat ng Tao na Naging Bahagi ng Ating Pinagmulan
</button>


<button class="info-button" onclick="location.href='ilaya_ilawod.html'">
Ilaya at Ilawod
</button>


<button class="info-button" onclick="location.href='kultura.html'">
Ugnayan ng Kultura at Kamalayang Pangkasaysayan
</button>


<button class="info-button" onclick="location.href='paniniwala.html'">
Paniniwala at Pananampalataya
</button>


</div>



<div class="bottom-images">

    <img class="church" src="Church.png">

    <img class="tower" src="Tower.png">

</div>


</body>

</html>
