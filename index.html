<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phoenix - Histo Page</title>

<style>

/* =========================
   BODY
========================= */

body{
    margin:0;
    min-height:100vh;
    background:#b99272;
    font-family:Georgia, serif;
    text-align:center;
    overflow-x:hidden;
}


/* =========================
   TOP PAPER
========================= */

.paper{
    width:80%;
    max-width:900px;

    margin:40px auto;

    box-sizing:border-box;

    background:#f8f1df;

    border:8px solid #d8c3a3;

    padding:50px;

    position:relative;

    box-shadow:0 0 20px rgba(0,0,0,.25);

    animation:paperEnter .8s ease-out;
}


@keyframes paperEnter{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


.paper h3{
    color:#5b3a1e;
    margin:0;
    font-size:32px;
}


.paper h4{
    color:#5b3a1e;
    margin:10px 0;
    font-size:24px;
}


.paper h1{
    color:#5b3a1e;

    font-size:90px;

    font-family:cursive;

    margin-top:70px;

    animation:titleEnter 1s ease-out .5s both;
}


@keyframes titleEnter{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   DECORATIONS
========================= */

.clock{
    position:absolute;

    top:-20px;
    right:-20px;

    width:80px;
}


.feather{
    position:absolute;

    left:-20px;
    bottom:10px;

    width:130px;
}


.phoenix-logo{
    width:120px;

    margin-bottom:20px;

    animation:logoEnter 1s ease-out .3s both;
}


@keyframes logoEnter{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


/* =========================
   NAVIGATION
========================= */

.navigation{
    width:100%;

    margin:60px auto;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =========================
   SCROLL HANDLE
========================= */

.scroll-button{
    width:60%;

    background:#8b5a2b;

    color:#f8f1df;

    border:none;

    padding:20px 40px;

    margin:20px auto 0;

    font-size:25px;

    font-family:Georgia, serif;

    border-radius:12px;

    cursor:pointer;

    box-shadow:0 5px 10px rgba(0,0,0,.3);

    transition:.3s;

    position:relative;

    z-index:2;
}


.scroll-button:hover{
    background:#a66b35;

    transform:translateY(-5px);

    box-shadow:0 10px 15px rgba(0,0,0,.4);
}


.scroll-button:active{
    transform:translateY(2px);
}


/* =========================
   SCROLL PAPER
========================= */

.scroll{
    width:60%;

    box-sizing:border-box;

    background:#f8f1df;

    border-left:5px solid #d8c3a3;
    border-right:5px solid #d8c3a3;

    overflow:hidden;

    max-height:0;

    opacity:0;

    transform:scaleY(0);

    transform-origin:top;

    transition:
        max-height .7s ease,
        opacity .4s ease,
        transform .7s ease,
        padding .7s ease;

    box-shadow:0 8px 15px rgba(0,0,0,.2);
}


/* Open Scroll */

.scroll.open{
    max-height:1200px;

    opacity:1;

    transform:scaleY(1);

    padding:25px 20px;
}


/* =========================
   SCROLL ROLLS
========================= */

.scroll-top,
.scroll-bottom{
    height:18px;

    background:#d8c3a3;

    border-radius:12px;

    box-shadow:0 3px 5px rgba(0,0,0,.2);
}


.scroll-bottom{
    margin-top:20px;

    box-shadow:0 -3px 5px rgba(0,0,0,.2);
}


/* =========================
   MEMBER NAMES
========================= */

.member-name{
    color:#5b3a1e;

    font-size:22px;

    margin:14px 0;

    opacity:0;

    transform:translateY(-10px);

    transition:.4s ease;
}


.scroll.open .member-name{
    opacity:1;

    transform:translateY(0);
}


.member-name:nth-child(2){
    transition-delay:.1s;
}

.member-name:nth-child(3){
    transition-delay:.15s;
}

.member-name:nth-child(4){
    transition-delay:.2s;
}

.member-name:nth-child(5){
    transition-delay:.25s;
}

.member-name:nth-child(6){
    transition-delay:.3s;
}

.member-name:nth-child(7){
    transition-delay:.35s;
}

.member-name:nth-child(8){
    transition-delay:.4s;
}

.member-name:nth-child(9){
    transition-delay:.45s;
}


/* =========================
   LESSON BUTTONS
========================= */

.lesson-button{
    width:90%;

    background:#8b5a2b;

    color:#f8f1df;

    border:none;

    padding:18px 25px;

    margin:12px auto;

    font-size:21px;

    font-family:Georgia, serif;

    border-radius:12px;

    cursor:pointer;

    box-shadow:0 5px 10px rgba(0,0,0,.3);

    opacity:0;

    transform:translateY(-10px);

    transition:
        opacity .4s ease,
        transform .3s ease,
        background .3s ease,
        box-shadow .3s ease;
}


.scroll.open .lesson-button{
    opacity:1;

    transform:translateY(0);
}


.lesson-button:hover{
    background:#a66b35;

    transform:translateY(-5px);

    box-shadow:0 10px 15px rgba(0,0,0,.4);
}


.lesson-button:active{
    transform:translateY(2px);
}


/* Lesson stagger */

.lesson-button:nth-child(2){
    transition-delay:.1s;
}

.lesson-button:nth-child(3){
    transition-delay:.15s;
}

.lesson-button:nth-child(4){
    transition-delay:.2s;
}

.lesson-button:nth-child(5){
    transition-delay:.25s;
}

.lesson-button:nth-child(6){
    transition-delay:.3s;
}

.lesson-button:nth-child(7){
    transition-delay:.35s;
}

.lesson-button:nth-child(8){
    transition-delay:.4s;
}

.lesson-button:nth-child(9){
    transition-delay:.45s;
}

.lesson-button:nth-child(10){
    transition-delay:.5s;
}


/* =========================
   BOTTOM IMAGES
========================= */

.bottom-images{
    width:100%;

    height:220px;

    display:flex;

    justify-content:space-between;

    align-items:flex-end;

    margin-top:100px;
}


.church{
    width:400px;

    opacity:.80;
}


.tower{
    width:280px;

    opacity:.80;
}


/* =========================
   MOBILE
========================= */

@media screen and (max-width:600px){

    .paper{
        width:90%;
        padding:30px;
    }


    .paper h1{
        font-size:55px;
    }


    .paper h3{
        font-size:24px;
    }


    .paper h4{
        font-size:18px;
    }


    .phoenix-logo{
        width:90px;
    }


    .scroll-button{
        width:85%;

        font-size:18px;

        padding:15px 20px;
    }


    .scroll{
        width:85%;
    }


    .lesson-button{
        width:95%;

        font-size:18px;

        padding:15px;
    }


    .member-name{
        font-size:18px;
    }


    .clock{
        width:60px;
    }


    .feather{
        width:90px;
    }


    .church{
        width:230px;
    }


    .tower{
        width:170px;
    }

}

</style>

</head>

<body>

</div>



<!-- =========================

========================= -->

<div class="bottom-images">

<script>

</body>

</html>
