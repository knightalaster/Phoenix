<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phoenix - Histo Page</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#b99272;
    font-family:Georgia, serif;
    text-align:center;
    overflow-x:hidden;
}


/* Top Paper */

.paper{
    width:75%;
    margin:40px auto;
    background:#f8f1df;
    border:8px solid #d8c3a3;
    padding:70px;
    position:relative;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}


.paper h3{
    color:#16186b;
    margin:0;
    font-size:32px;
}


.paper h4{
    color:#16186b;
    margin:10px 0;
    font-size:24px;
}


.paper h1{
    color:#16186b;
    font-size:90px;
    font-family:cursive;
    margin-top:70px;
}


/* Decorations */

.clock{
    position:absolute;
    top:-20px;
    right:-20px;
    width:80px;
}


.feather{
    position:absolute;
    left:-20px;
    bottom:10px;
    width:130px;
}


.phoenix-logo{
    width:120px;
    margin-bottom:20px;
}


/* Buttons */

.buttons{
    margin:60px auto;
}


.info-button{
    background:#16186b;
    color:#f8f1df;
    border:none;
    padding:20px 40px;
    margin:20px;
    font-size:25px;
    font-family:Georgia, serif;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 5px 10px rgba(0,0,0,.3);
}


.info-button:hover{
    background:#2b2d9b;
}


/* Bottom Images */

.bottom-images{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:100px;
}


.church{
    width:150px;
}


.tower{
    width:120px;
}

</style>

</head>


<body>


<div class="paper">

    <img class="clock" src="Clock.png">

    <img class="phoenix-logo" src="Phoenix.png">

    <h3>HISTO PAGE</h3>
    <h4>TECH-PRO 1103</h4>

    <h1>"Phoenix"</h1>

    <img class="feather" src="Feather.png">

</div>



<div class="buttons">

<button class="info-button" onclick="location.href='members.html'">
Members
</button>


<button class="info-button" onclick="location.href='history.html'">
Kahulugan ng Kasaysayan
</button>


<button class="info-button" onclick="location.href='groups.html'">
Pangkat ng Tao
</button>

</div>



<div class="bottom-images">

    <img class="church" src="Church.png">

    <img class="tower" src="Tower.png">

</div>


</body>

</html>
