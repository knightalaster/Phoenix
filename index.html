<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix - Histo Page</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#b99272;
    font-family:Georgia, serif;
    text-align:center;
    overflow-x:hidden;
}

/* Top Paper */
.paper{
    width:75%;
    margin:40px auto;
    background:#f8f1df;
    border:8px solid #d8c3a3;
    padding:70px;
    position:relative;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}

.paper h3{
    color:#16186b;
    margin:0;
    font-size:32px;
}

.paper h4{
    color:#16186b;
    margin:10px 0;
    font-size:24px;
}

.paper h1{
    color:#16186b;
    font-size:90px;
    font-family:cursive;
    margin-top:70px;
}

/* Decorations */
.clock{
    position:absolute;
    top:-20px;
    right:-20px;
    width:80px;
}

.feather{
    position:absolute;
    left:-20px;
    bottom:10px;
    width:130px;
}

/* Scroll */
.scroll{
    width:430px;
    margin:60px auto;
    background:#efe0b3;
    border:8px solid #c6a46d;
    border-radius:12px;
    padding:60px 30px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

.scroll h2{
    color:#16186b;
    font-size:45px;
    font-family:cursive;
}

.scroll p{
    color:#16186b;
    font-size:30px;
    line-height:1.6;
    margin:0;
}

/* Bottom Images */
.church{
.church{
    display:inline-block;
    width:150px;
    margin-top:60px;
}

.tower{
    display:inline-block;
    width:120px;
    margin-top:60px;
}

</style>

</head>

<body>

<div class="paper">

<img class="clock" src="Clock.png">

<h3>HISTO PAGE</h3>
<h4>TECH-PRO 1103</h4>

<h1>"Phoenix"</h1>

<img class="feather" src="Feather.png">

</div>

<div class="scroll">

<h2>Members</h2>

<p>
Sam Eduard O. Alaan<br>
Angeline Blando<br>
Ilym Plaza<br>
Venice Dela Cruz<br>
Elmer Jr. Alcaraz<br>
Prince Delgado<br>
Ariane Mae Dailisan
</p>

</div>

<img class="church" src="Church.png">
<img class="tower" src="Tower.png">

</body>
</html>
